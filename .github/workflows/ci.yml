name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/upgrade-gate.sh compares the recorded schema
          # fixtures with `git show <commit>:db/schema.sql` for each release commit.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify Norma upstream provenance
        run: python3 scripts/verify-norma-source.py
      - run: go build ./...
      - run: go vet ./...
      # The localized SDK is a nested module and is excluded from root ./....
      - name: Norma SDK contracts
        working-directory: third_party/norma
        run: go test ./... -timeout=240s
      - name: Norma protocol and tool races
        working-directory: third_party/norma
        run: go test -race ./llm ./harness ./agentcore -run 'Thinking|Redacted|Untrusted|RawInput|WebFetch|Transcript' -timeout=180s
      # Skipped tests, tracked in issue #9:
      # - TestInterceptFilterHTTP, TestGraphOverviewExpandsAssociatedCompanyScope,
      #   TestCaptureApprovalLifecycle: fail on unmodified upstream code with a
      #   fresh database.
      # - TestSideUsageRecordedOnceOnConsumerCancellation: concurrency/cancellation
      #   test that passes locally but is timing-sensitive on 2-core CI runners.
      # They now skip themselves in code (t.Skip with a pointer to the issue).
      - name: go test
        # -p 1: package test suites share the single postgres service; running
        # them in parallel makes packages delete each other's rows (observed
        # as rotating failures in the agent package). Serial package execution
        # keeps the database state deterministic.
        run: go test -p 1 ./...
      - name: Schema upgrade test gate
        # Fails when an upgrade test is skipped or fewer than the expected number ran
        # (a skipped test reads as passed in the step above), and when a recorded
        # schema fixture differs from git history. Temporary databases are created
        # and dropped on the postgres service, named <database>_<package>_upg_<case>.
        env:
          UPGRADE_GATE_REQUIRE_GIT: "1"
        run: bash scripts/upgrade-gate.sh
      - name: go test -race
        # Race detector on the packages that pass under -race today. ./server is
        # left out until it has been checked with -race against postgres.
        # Its own database: the plain run above leaves rows behind and the db tests
        # are not idempotent across runs (duplicate llm_profiles names).
        env:
          ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest_race?sslmode=disable

        run: >-
          go test -race -p 1 ./agent ./cmd/artex ./config ./db ./db/dbtest ./evidence ./guard
          ./intercept ./llmpool ./llmrec ./mcphttp ./notify ./sidequestion ./traffic
      - name: Norma server adapter races
        run: go test -race ./server -run 'TestNormaRetry|TestNormaOpaque|TestFixedEndpointConnection' -timeout=180s

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the ubuntu runners. -S warning: the scripts
      # currently have only info-level notes (intentional A && B || C chains in
      # update.sh, an unquoted glob in backup.sh's prune), so fail on warnings.
      - run: shellcheck -S warning install.sh update.sh start.sh scripts/backup.sh scripts/upgrade-gate.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build:static

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application from a clean checkout
        run: docker build --target build --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 .
