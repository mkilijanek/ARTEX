name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Fork release tag (vMAJOR.MINOR.PATCHm)
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write # required to create the Release
  packages: write # publish fork release images to GHCR

jobs:
  # ① Frontend static export (once), reused by the cross-compiled platform builds
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Cross-compile for five platforms (with embedded frontend) + zip packaging
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ inputs.version || github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF binaries crash on some Linux kernels, virtualization
          # setups, and security policies. Releases use Go linker trimming and zip
          # compression, prioritizing portability.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Upload raw Linux binaries separately for reuse by the docker job (avoids rebuilding the frontend + Go inside the image)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ Collect all zips → create the GitHub Release
  release:
    needs: [binaries, ghcr, ghcr-signal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the description lists the merges since the previous release tag
          path: src
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      # Software bill of materials of the tagged source: Go modules (including the
      # vendored SDK) and the frontend lockfile. The image carries its own SBOM as
      # an attestation (see the ghcr job).
      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: src
          format: spdx-json
          output-file: dist/artex-${{ inputs.version || github.ref_name }}-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- ./*.zip ./*.spdx.json > SHA256SUMS
      # The description holds the tag subject and the merge subjects only. Tagger and
      # author names, e-mail addresses and host names are deliberately left out.
      - name: Write release description
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cd src
          # shellcheck disable=SC2153 # IMAGE is set in env above; image is its lower-case copy
          image="${IMAGE,,}"
          # checkout can leave an annotated tag as a plain commit reference: fetch the
          # tag object itself, and use its subject only when it is an annotated tag.
          git fetch -q --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null || true
          subject=""
          if [ "$(git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(objecttype)')" = "tag" ]; then
            subject="$(git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents:subject)')"
          fi
          prev="$(git describe --tags --abbrev=0 --match 'v*m' "HEAD^" 2>/dev/null || true)"
          {
            echo "Fork release \`$RELEASE_TAG\` (the trailing \`m\` distinguishes this fork)."
            if [ -n "$subject" ]; then echo; echo "$subject"; fi
            echo
            echo "Source: \`$GITHUB_SHA\`."
            if [ -n "$prev" ]; then
              echo
              echo "## Changes since $prev"
              echo
              git log --merges --first-parent --format='- %s' "$prev..HEAD"
            fi
            echo
            echo "## Artifacts"
            echo
            echo "- Five platform archives and \`SHA256SUMS\`."
            echo "- \`artex-$RELEASE_TAG-source.spdx.json\`: SBOM of the tagged source (SPDX)."
            echo "- Docker image \`$image:$RELEASE_TAG\` (\`linux/amd64\`), with an SBOM attestation. The digest is in the workflow summary."
            echo "- Docker image \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/artex-signal:$RELEASE_TAG\` (\`linux/amd64\`), the Signal sidecar, with SBOM and provenance attestations."
            echo
            echo "Details: \`CHANGELOG.md\`."
          } > ../release-notes.md
          cat ../release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.spdx.json
            dist/SHA256SUMS
          generate_release_notes: false
          body_path: release-notes.md

  # ④ Multi-arch image → push to Docker Hub (reuses the Linux binaries built by the
  #    binaries job; the image only installs tools + ships the binary; arm64 only needs
  #    to emulate the apt layer, so builds are much faster)
  # Publishing the image needs Docker Hub credentials and a namespace we own, so the
  # job stays skipped unless the repository defines DOCKERHUB_ENABLED (set it to true
  # and provide DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets plus DOCKERHUB_IMAGE).
  docker:
    needs: binaries
    if: ${{ github.event_name == 'push' && vars.DOCKERHUB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # fetch the Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fork releases are identifiable by the trailing m. Publish the exact tagged
  # source, including its versioned binary, before creating the GitHub Release.
  ghcr:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      # No personal data in labels or annotations: no author, vendor or maintainer fields.
      IMAGE_DESCRIPTION: "ARTEX fork: AI autonomous penetration testing system (Go backend with embedded Next.js frontend). Fork releases carry the trailing m."
    steps:
      - uses: actions/checkout@v4
      - name: Validate fork version and image name
        id: version
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+m$ ]] || { echo "Expected vMAJOR.MINOR.PATCHm"; exit 1; }
          {
            echo "version=${RELEASE_TAG#v}"
            echo "image=ghcr.io/${IMAGE_REPOSITORY,,}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Free space on the disposable build runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: ARTEX_VERSION=${{ inputs.version || github.ref_name }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ inputs.version || github.ref_name }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest-m
          # SBOM attestation stored next to the image; it makes the pushed reference an
          # image index, so the annotations are set on the index and on the manifest.
          sbom: true
          labels: |
            org.opencontainers.image.title=ARTEX
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version || github.ref_name }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          annotations: |
            index,manifest:org.opencontainers.image.title=ARTEX
            index,manifest:org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            index,manifest:org.opencontainers.image.licenses=AGPL-3.0-only
            index,manifest:org.opencontainers.image.url=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.version=${{ inputs.version || github.ref_name }}
            index,manifest:org.opencontainers.image.created=${{ steps.version.outputs.created }}
          cache-from: type=gha,scope=fork-release-amd64
          cache-to: type=gha,scope=fork-release-amd64,mode=max
      - name: Verify published manifest
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ inputs.version || github.ref_name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          # Fail the release if the SBOM attestation is missing.
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM }}' | grep -q '"SPDXID"'
          {
            echo "### $VERSION"
            echo "Image: $IMAGE:$VERSION"
            echo "Digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  # The sidecar tests, with the same database service as ci.yml. The sidecar image is not
  # pushed unless they pass. There is no image scanner in the repository: scan the image by
  # hand before announcing a release.
  signal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (sidecar)
        run: go test -p 1 -count=1 ./signalsidecar/... ./cmd/artex-signal/...

  # The Signal sidecar image: same trigger, same version tag and same checks as the ARTEX
  # image above. Pushed by digest first and tagged only after the attestations are verified.
  ghcr-signal:
    needs: [binaries, signal-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate fork version and image name
        id: version
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+m$ ]] || { echo "Expected vMAJOR.MINOR.PATCHm"; exit 1; }
          {
            echo "version=${RELEASE_TAG#v}"
            echo "image=ghcr.io/${IMAGE_OWNER,,}/artex-signal"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the sidecar image (by digest, no tag)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/signal/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: ARTEX_VERSION=${{ inputs.version || github.ref_name }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version || github.ref_name }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          annotations: |
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.version=${{ inputs.version || github.ref_name }}
            index,manifest:org.opencontainers.image.created=${{ steps.version.outputs.created }}
          cache-from: type=gha,scope=fork-release-signal-amd64
          cache-to: type=gha,scope=fork-release-signal-amd64,mode=max
      - name: Verify the pushed digest
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest ('$DIGEST')"; exit 1; }
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref"
          # Written to a file first: the SBOM is large and a reader that quits early would
          # fail the pipe.
          attestations=$(mktemp)
          docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' > "$attestations"
          jq -e '.SPDX.SPDXID == "SPDXRef-DOCUMENT"' "$attestations" > /dev/null \
            || { echo "::error::no SPDX SBOM attestation on $ref"; exit 1; }
          docker buildx imagetools inspect "$ref" --format '{{ json .Provenance }}' > "$attestations"
          jq -e '.SLSA.buildDefinition' "$attestations" > /dev/null \
            || { echo "::error::no provenance attestation on $ref"; exit 1; }
          rm -f "$attestations"
      - name: Tag the verified digest
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          [ "$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{ .Manifest.Digest }}')" = "$DIGEST" ] \
            || { echo "::error::$IMAGE:$RELEASE_TAG does not resolve to $DIGEST"; exit 1; }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Write the summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          {
            echo "### $VERSION (sidecar)"
            echo "Image: $IMAGE:$VERSION"
            echo "Digest: $DIGEST"
            echo
            echo "Vulnerability scan: not run by this workflow; the scan of this digest is attached to the release approval per the release runbook."
          } >> "$GITHUB_STEP_SUMMARY"
