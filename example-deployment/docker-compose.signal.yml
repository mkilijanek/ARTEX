# Override: send notifications through Signal, using the artex-signal sidecar.
#
#   docker compose -f docker-compose.yml -f docker-compose.signal.yml up -d
#
# Needs ARTEX 0.5.19m or later (set ARTEX_VERSION accordingly); older images have no Signal channel.
# Required in .env: ARTEX_SIGNAL_DB_PASSWORD, a long random value (for example openssl rand -hex 24).
# The database role of the sidecar is ARTEX_SIGNAL_DB_ROLE (default artex_signal). It must
# never be the POSTGRES_USER role.
#
# The sidecar keeps the Signal account keys in the artex-signal-data volume: whoever can
# read it can send as that account. Back it up like a secret and do not delete it casually.
#
# Layout:
#   - No bridge and no proxy: the sidecar is one image (docker/signal/Dockerfile) that talks
#     to the Signal servers itself. Nothing sits in front of it.
#   - Socket only: the sidecar listens on a Unix socket in the artex-signal-sock volume.
#     artex mounts that volume under /run/artex-private, so the socket is the only path
#     between the two containers. Nothing is published on the host and there is no port.
#   - Database read-only socket: the sidecar reaches PostgreSQL through the pgsock volume,
#     mounted read-only. It cannot change or replace the socket directory. Its own role
#     limits what it may do in the database.
#   - Network: the sidecar is on signal-egress only, which has outbound access to the
#     Signal servers. artex is not on that network, so the two share no network at all.
#
# On a host with SELinux enforcing, the shared volumes need the :z label (set below), and
# the volume that only the sidecar writes gets the private :Z label.
services:
  artex-signal:
    # The image of the same release as artex. Pin by digest through ARTEX_SIGNAL_IMAGE
    # (name@sha256:...) for an immutable image.
    image: ${ARTEX_SIGNAL_IMAGE:-ghcr.io/mkilijanek/artex-signal:${ARTEX_VERSION:?set ARTEX_VERSION}}
    # Not root: the same numeric user as the image's own USER line, set explicitly here.
    user: "10001:10001"
    # The root filesystem is read-only. The sidecar writes only to its two volumes and to /tmp.
    read_only: true
    # /tmp is in memory and cannot run programs: noexec and nosuid.
    tmpfs:
      - /tmp:noexec,nosuid,size=64m,mode=0700,uid=10001,gid=10001
    # Drop every Linux capability, and forbid gaining new ones through setuid binaries.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Limits for a JVM plus the supervisor: processes, memory, and a reaper for children.
    pids_limit: 256
    mem_limit: 768m
    init: true
    # No ports: nothing listens on a network address. artex reaches the sidecar through the socket only.
    environment:
      # Database connection over the read-only PostgreSQL socket, as the sidecar's own role.
      ARTEX_SIGNAL_PG_DSN: "host=/var/run/postgresql user=${ARTEX_SIGNAL_DB_ROLE:-artex_signal} password=${ARTEX_SIGNAL_DB_PASSWORD:?set ARTEX_SIGNAL_DB_PASSWORD} dbname=${POSTGRES_DB:-artex} sslmode=disable"
    volumes:
      # Account keys and state. Written by the sidecar only.
      - artex-signal-data:/data:Z
      # The Unix socket that artex connects to.
      - artex-signal-sock:/sock:z
      # The database socket, read-only (see the layout notes above).
      - pgsock:/var/run/postgresql:ro,z
    networks:
      - signal-egress
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  artex:
    environment:
      # Signal API over the Unix socket only: there is no network address and no bridge.
      ARTEX_SIGNAL_API: "unix:/run/artex-private/signal/api.sock"
      # Password of the sidecar's database role. artex creates that role with this password.
      ARTEX_SIGNAL_DB_PASSWORD: ${ARTEX_SIGNAL_DB_PASSWORD:?set ARTEX_SIGNAL_DB_PASSWORD}
    volumes:
      # The socket of the sidecar. This is the only path shared between the two containers.
      - artex-signal-sock:/run/artex-private/signal:z

networks:
  # Outbound access for the sidecar to the Signal servers. artex is not a member.
  signal-egress: {}

volumes:
  artex-signal-data:
  artex-signal-sock:
