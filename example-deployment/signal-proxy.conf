# nginx allowlist in front of the signal-cli REST bridge (docker-compose.signal.yml).
# Mounted read-only as /etc/nginx/nginx.conf; the container's root filesystem is read-only,
# so every temp path and the pid file are under /tmp (a tmpfs).
#
# Exact locations only (no prefix matches). nginx decodes and normalises the path before
# matching, so an encoded form such as /v1/devices/X%2f..%2f..%2f..%2fv2%2fsend is treated as
# /v2/send, i.e. as an ordinary send; the bridge only ever receives /v2/send or /v1/about.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    log_format upstream '$time_iso8601 "$request" $status upstream=$upstream_addr $upstream_status $request_time';
    access_log /dev/stdout upstream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Re-resolve the bridge so that a restarted bridge (new IP) needs no proxy restart.
    resolver 127.0.0.11 valid=10s;

    server {
        listen unix:/sock/api.sock;

        client_max_body_size 1k;
        proxy_read_timeout 25s;

        # The explicit URI with a variable makes nginx send exactly that URI and drop the
        # client's query string.
        location = /v2/send {
            limit_except POST { deny all; }
            client_max_body_size 64k;
            set $bridge signal-cli:8080;
            proxy_pass http://$bridge/v2/send;
        }

        location = /v1/about {
            limit_except GET { deny all; }
            set $bridge signal-cli:8080;
            proxy_pass http://$bridge/v1/about;
        }

        location / {
            return 403;
        }
    }
}
