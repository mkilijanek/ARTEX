services:
  postgres:
    image: postgres:16-alpine
    # The database has no network at all and does not listen on TCP: it is reached only
    # through a Unix socket in the pgsock volume, which the artex service also mounts.
    # There is therefore nothing to publish, and no other container can dial it.
    # Use `docker compose exec postgres psql ...` for a shell on it.
    network_mode: "none"
    command: ["postgres", "-c", "listen_addresses="]
    environment:
      # Applies to a NEW data volume only: local and host connections need a password
      # (scram-sha-256). An existing pgdata volume keeps the pg_hba.conf it was created
      # with (trust); see the upgrade steps in .env.example.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The :z label matters on hosts with SELinux in enforcing mode (Fedora, RHEL): a
      # named volume shared by two containers is otherwise unreadable by the second one
      # and artex fails with "permission denied" on the socket. It is a no-op elsewhere.
      - pgsock:/var/run/postgresql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: .
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
    image: artex:local
    # Docker's init as PID 1 reaps zombie processes, including orphaned tool processes and
    # what `docker exec` sessions leave behind. Without it, start.sh as PID 1 reaps them too.
    init: true
    # Upper bound on processes in the container; tool processes are held lower (4096) by the drop chain.
    pids_limit: 8192
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-1}
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@/${POSTGRES_DB:-artex}?host=/run/artex-private/postgres&sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_BOUNDED_CONTEXT: ${ARTEX_BOUNDED_CONTEXT:-0}
      ARTEX_WORKER_CONTEXT: ${ARTEX_WORKER_CONTEXT:-0}
      ARTEX_CACHE_PREFIX: ${ARTEX_CACHE_PREFIX:-0}
      ARTEX_COMPACTION_MEMO: ${ARTEX_COMPACTION_MEMO:-0}
      # Schema migrations: empty means not set. See docs/schema-upgrade.md before using it.
      ARTEX_SCHEMA_ALLOW_NEWER: ${ARTEX_SCHEMA_ALLOW_NEWER:-}
      # Tool RAG observation: empty means the default (observe); "off" disables it. See docs/tool-rag-observation.md.
      ARTEX_TOOL_RAG: ${ARTEX_TOOL_RAG:-}
      ARTEX_TOOL_RAG_TOPK: ${ARTEX_TOOL_RAG_TOPK:-}
      # Tool isolation: empty means the default (on). "off" keeps the old behaviour and
      # only adds warnings; see .env.example.
      ARTEX_TOOL_ISOLATION: ${ARTEX_TOOL_ISOLATION:-}
    ports:
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
      # The database socket (see the postgres service for the :z label). The mount sits
      # under /run/artex-private so that access can be limited to the server's own user.
      - pgsock:/run/artex-private/postgres:z
    restart: unless-stopped

volumes:
  pgdata:
  pgsock:
